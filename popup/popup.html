<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Drupal++</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header class="head">
      <img src="../icons/icon.svg" width="24" height="24" alt="">
      <h1>Drupal++</h1>
    </header>

    <section class="group" aria-labelledby="theme-label">
      <h2 id="theme-label">Appearance</h2>
      <div class="segmented" role="radiogroup" aria-labelledby="theme-label">
        <label>
          <input type="radio" name="theme" value="light">
          <span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            Light
          </span>
        </label>
        <label>
          <input type="radio" name="theme" value="dark">
          <span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
            Dark
          </span>
        </label>
        <label>
          <input type="radio" name="theme" value="system">
          <span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            System
          </span>
        </label>
      </div>
    </section>

    <section class="features" aria-labelledby="features-label">
      <h2 id="features-label">Features</h2>

      <label class="switch">
        <span class="switch-text">
          <span class="switch-title">Wide layout</span>
          <span class="switch-hint">Pages up to 1280px instead of 960px</span>
        </span>
        <input type="checkbox" name="wide" role="switch">
        <span class="track" aria-hidden="true"></span>
      </label>

      <label class="switch">
        <span class="switch-text">
          <span class="switch-title">Visual polish</span>
          <span class="switch-hint">Consistent forms, boxes and spacing</span>
        </span>
        <input type="checkbox" name="polish" role="switch">
        <span class="track" aria-hidden="true"></span>
      </label>

      <label class="switch">
        <span class="switch-text">
          <span class="switch-title">Image gallery</span>
          <span class="switch-hint">Open images in a fullscreen viewer</span>
        </span>
        <input type="checkbox" name="lightbox" role="switch">
        <span class="track" aria-hidden="true"></span>
      </label>

      <label class="switch">
        <span class="switch-text">
          <span class="switch-title">Issue reading</span>
          <span class="switch-hint">Wider page and a sticky sidebar</span>
        </span>
        <input type="checkbox" name="reading" role="switch">
        <span class="track" aria-hidden="true"></span>
      </label>

      <label class="switch">
        <span class="switch-text">
          <span class="switch-title">Copy</span>
          <span class="switch-hint">Copy the page link or a code block</span>
        </span>
        <input type="checkbox" name="copy" role="switch">
        <span class="track" aria-hidden="true"></span>
      </label>

      <label class="switch">
        <span class="switch-text">
          <span class="switch-title">API docs</span>
          <span class="switch-hint">Sticky navigation</span>
        </span>
        <input type="checkbox" name="apiDocs" role="switch">
        <span class="track" aria-hidden="true"></span>
      </label>

      <label class="switch">
        <span class="switch-text">
          <span class="switch-title">Mentions</span>
          <span class="switch-hint">Link @names and highlight your own</span>
        </span>
        <input type="checkbox" name="mentions" role="switch">
        <span class="track" aria-hidden="true"></span>
      </label>

      <label class="switch">
        <span class="switch-text">
          <span class="switch-title">Newest first</span>
          <span class="switch-hint">Show the latest comments at the top</span>
        </span>
        <input type="checkbox" name="newestFirst" role="switch">
        <span class="track" aria-hidden="true"></span>
      </label>

      <label class="switch">
        <span class="switch-text">
          <span class="switch-title">Keyboard</span>
          <span class="switch-hint">j and k move between comments</span>
        </span>
        <input type="checkbox" name="keys" role="switch">
        <span class="track" aria-hidden="true"></span>
      </label>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
